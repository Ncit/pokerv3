<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Spectator Join</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #1a1a1a;
            color: #ffffff;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .test-section {
            background-color: #2a2a2a;
            padding: 20px;
            margin: 20px 0;
            border-radius: 8px;
            border: 1px solid #444;
        }
        .log {
            background-color: #000;
            color: #00ff00;
            padding: 15px;
            border-radius: 5px;
            font-family: monospace;
            font-size: 12px;
            max-height: 400px;
            overflow-y: auto;
            white-space: pre-wrap;
        }
        .status {
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
            font-weight: bold;
        }
        .success { background-color: #2d5a2d; }
        .error { background-color: #5a2d2d; }
        .info { background-color: #2d2d5a; }
        .warning { background-color: #5a5a2d; }
        button {
            background-color: #4CAF50;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
        }
        button:hover {
            background-color: #45a049;
        }
        button:disabled {
            background-color: #666;
            cursor: not-allowed;
        }
        .player-info {
            display: flex;
            gap: 20px;
            margin: 10px 0;
        }
        .player-card {
            background-color: #333;
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #555;
        }
        .spectator {
            border-color: #ff6b6b;
            background-color: #3a2a2a;
        }
        .game-state {
            background-color: #333;
            padding: 15px;
            border-radius: 5px;
            border: 1px solid #555;
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧪 Test Spectator Join</h1>
        <p>This test verifies that players who join during an active game become spectators and don't receive cards until the game restarts.</p>

        <div class="test-section">
            <h2>Test Setup</h2>
            <button id="startTest">Start Test</button>
            <button id="resetTest">Reset Test</button>
            <div id="testStatus" class="status info">Ready to start test</div>
        </div>

        <div class="test-section">
            <h2>Game State</h2>
            <div id="gameState" class="game-state">Not connected</div>
        </div>

        <div class="test-section">
            <h2>Players</h2>
            <div id="playersContainer"></div>
        </div>

        <div class="test-section">
            <h2>Test Log</h2>
            <div id="log" class="log"></div>
        </div>
    </div>

    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script>
        class SpectatorJoinTest {
            constructor() {
                this.socket = null;
                this.gameState = null;
                this.players = [];
                this.myPlayerId = null;
                this.testStep = 0;
                this.spectatorPlayerId = null;
                
                this.setupEventListeners();
            }

            setupEventListeners() {
                document.getElementById('startTest').addEventListener('click', () => this.startTest());
                document.getElementById('resetTest').addEventListener('click', () => this.resetTest());
            }

            log(message) {
                const logElement = document.getElementById('log');
                const timestamp = new Date().toLocaleTimeString();
                logElement.textContent += `[${timestamp}] ${message}\n`;
                logElement.scrollTop = logElement.scrollHeight;
                console.log(message);
            }

            updateStatus(message, type = 'info') {
                const statusElement = document.getElementById('testStatus');
                statusElement.textContent = message;
                statusElement.className = `status ${type}`;
            }

            updateGameState() {
                const gameStateElement = document.getElementById('gameState');
                if (this.gameState) {
                    gameStateElement.innerHTML = `
                        <strong>Status:</strong> ${this.gameState.status}<br>
                        <strong>Phase:</strong> ${this.gameState.phase}<br>
                        <strong>Pot:</strong> ${this.gameState.pot}<br>
                        <strong>Current Bet:</strong> ${this.gameState.currentBet}<br>
                        <strong>Players:</strong> ${this.gameState.totalPlayers}/${this.gameState.maxPlayers}<br>
                        <strong>Ready Players:</strong> ${this.gameState.readyCount}<br>
                        <strong>All Ready:</strong> ${this.gameState.allPlayersReady ? 'Yes' : 'No'}
                    `;
                } else {
                    gameStateElement.textContent = 'Not connected';
                }
            }

            updatePlayers() {
                const container = document.getElementById('playersContainer');
                if (!this.players || this.players.length === 0) {
                    container.innerHTML = '<p>No players</p>';
                    return;
                }

                container.innerHTML = this.players.map(player => {
                    const isCurrent = player.isCurrentPlayer;
                    const isMe = player.id === this.myPlayerId;
                    const isSpectator = player.isSpectator;
                    
                    return `
                        <div class="player-card ${isSpectator ? 'spectator' : ''}">
                            <strong>${player.name}</strong> ${isMe ? '(YOU)' : ''} ${isCurrent ? '(CURRENT)' : ''} ${isSpectator ? '(SPECTATOR)' : ''}<br>
                            Bank: ${player.bank}<br>
                            Bet: ${player.currentBet}<br>
                            Folded: ${player.folded ? 'Yes' : 'No'}<br>
                            All-in: ${player.allIn ? 'Yes' : 'No'}<br>
                            Ready: ${player.ready ? 'Yes' : 'No'}<br>
                            Spectator: ${isSpectator ? 'Yes' : 'No'}<br>
                            Cards: ${player.hand ? player.hand.length : 0}
                        </div>
                    `;
                }).join('');
            }

            async startTest() {
                this.log('🚀 Starting Spectator Join Test');
                this.updateStatus('Connecting to server...', 'info');
                
                try {
                    await this.connectToServer();
                    await this.joinGame();
                    await this.waitForGameStart();
                    await this.verifySpectatorJoin();
                    await this.verifySpectatorNoCards();
                    await this.verifySpectatorConversion();
                    
                    this.log('✅ Test completed successfully!');
                    this.updateStatus('Test completed successfully!', 'success');
                } catch (error) {
                    this.log(`❌ Test failed: ${error.message}`);
                    this.updateStatus(`Test failed: ${error.message}`, 'error');
                }
            }

            connectToServer() {
                return new Promise((resolve, reject) => {
                    this.log('📡 Connecting to server...');
                    
                    this.socket = io('http://localhost:3000');
                    
                    this.socket.on('connect', () => {
                        this.log('✅ Connected to server');
                        resolve();
                    });
                    
                    this.socket.on('connect_error', (error) => {
                        this.log(`❌ Connection failed: ${error.message}`);
                        reject(new Error(`Connection failed: ${error.message}`));
                    });
                    
                    // Set up event listeners
                    this.setupSocketListeners();
                });
            }

            setupSocketListeners() {
                this.socket.on('gameJoined', (data) => {
                    this.log(`🎮 Joined game as ${data.playerId}`);
                    this.myPlayerId = data.playerId;
                    this.gameState = data.gameState;
                    this.players = data.players;
                    this.updateGameState();
                    this.updatePlayers();
                });

                this.socket.on('gameStateUpdate', (data) => {
                    this.log(`🔄 Game state updated: ${data.gameState.status} - ${data.gameState.phase}`);
                    this.gameState = data.gameState;
                    this.players = data.gameState.players;
                    this.updateGameState();
                    this.updatePlayers();
                    
                    if (data.gameStarted) {
                        this.log('🎮 Game started!');
                    }
                    
                    if (data.lastAction) {
                        this.log(`🎯 Last action: ${data.lastAction.action} by ${data.lastAction.playerName}`);
                    }
                });

                this.socket.on('playerJoined', (data) => {
                    this.log(`👤 Player joined: ${data.player.name}`);
                });

                this.socket.on('playerDisconnected', (data) => {
                    this.log(`👋 Player disconnected: ${data.playerName}`);
                });

                this.socket.on('error', (data) => {
                    this.log(`❌ Error: ${data.message}`);
                });
            }

            joinGame() {
                return new Promise((resolve) => {
                    this.log('🎯 Joining game...');
                    
                    const playerData = {
                        name: `TestPlayer_${Date.now()}`,
                        avatarUrl: 'https://gravatar.com/avatar/default?s=400&d=robohash&r=x'
                    };
                    
                    this.socket.emit('joinGame', playerData);
                    
                    // Wait for gameJoined event
                    const checkJoined = setInterval(() => {
                        if (this.myPlayerId) {
                            clearInterval(checkJoined);
                            resolve();
                        }
                    }, 100);
                });
            }

            waitForGameStart() {
                return new Promise((resolve) => {
                    this.log('⏳ Waiting for game to start...');
                    
                    const checkGameStarted = setInterval(() => {
                        if (this.gameState && this.gameState.status === 'playing') {
                            clearInterval(checkGameStarted);
                            this.log('🎮 Game is now playing!');
                            resolve();
                        }
                    }, 100);
                });
            }

            verifySpectatorJoin() {
                return new Promise((resolve) => {
                    this.log('👁️ Simulating spectator join during active game...');
                    
                    // Create a second connection to simulate another player joining
                    const spectatorSocket = io('http://localhost:3000');
                    
                    spectatorSocket.on('connect', () => {
                        this.log('📡 Spectator connecting...');
                        
                        const spectatorData = {
                            name: `Spectator_${Date.now()}`,
                            avatarUrl: 'https://gravatar.com/avatar/default?s=400&d=robohash&r=x'
                        };
                        
                        spectatorSocket.emit('joinGame', spectatorData);
                    });
                    
                    spectatorSocket.on('gameJoined', (data) => {
                        this.log(`👁️ Spectator joined: ${data.playerId}`);
                        this.spectatorPlayerId = data.playerId;
                        
                        // Wait a bit for the game state to update
                        setTimeout(() => {
                            spectatorSocket.disconnect();
                            resolve();
                        }, 1000);
                    });
                });
            }

            verifySpectatorNoCards() {
                return new Promise((resolve) => {
                    this.log('🔍 Verifying spectator has no cards...');
                    
                    const spectator = this.players.find(p => p.id === this.spectatorPlayerId);
                    if (spectator) {
                        if (spectator.isSpectator) {
                            this.log('✅ Spectator correctly marked as spectator');
                        } else {
                            this.log('❌ Spectator not marked as spectator');
                        }
                        
                        if (!spectator.hand || spectator.hand.length === 0) {
                            this.log('✅ Spectator has no cards (correct)');
                        } else {
                            this.log('❌ Spectator has cards (incorrect)');
                        }
                    } else {
                        this.log('⚠️ Spectator not found in player list');
                    }
                    
                    resolve();
                });
            }

            verifySpectatorConversion() {
                return new Promise((resolve) => {
                    this.log('🔄 Verifying spectator conversion after game ends...');
                    
                    // Simulate game ending by requesting a reset
                    this.socket.emit('resetRoom');
                    
                    const checkConversion = setInterval(() => {
                        const spectator = this.players.find(p => p.id === this.spectatorPlayerId);
                        if (spectator && !spectator.isSpectator) {
                            this.log('✅ Spectator converted to active player after game reset');
                            clearInterval(checkConversion);
                            resolve();
                        }
                    }, 500);
                    
                    // Timeout after 10 seconds
                    setTimeout(() => {
                        clearInterval(checkConversion);
                        this.log('⏰ Timeout waiting for spectator conversion');
                        resolve();
                    }, 10000);
                });
            }

            resetTest() {
                this.log('🔄 Resetting test...');
                this.updateStatus('Resetting test...', 'info');
                
                if (this.socket) {
                    this.socket.disconnect();
                    this.socket = null;
                }
                
                this.gameState = null;
                this.players = [];
                this.myPlayerId = null;
                this.testStep = 0;
                this.spectatorPlayerId = null;
                
                document.getElementById('log').textContent = '';
                this.updateGameState();
                this.updatePlayers();
                
                this.updateStatus('Ready to start test', 'info');
                this.log('✅ Test reset complete');
            }
        }

        // Initialize test when page loads
        document.addEventListener('DOMContentLoaded', () => {
            window.spectatorJoinTest = new SpectatorJoinTest();
        });
    </script>
</body>
</html>
