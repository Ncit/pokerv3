<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Message Test - Multiplayer</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background-color: #1a1a1a;
            color: white;
        }
        
        .test-container {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .player-panel {
            flex: 1;
            background-color: #333;
            padding: 15px;
            border-radius: 5px;
            border: 1px solid #555;
        }
        
        .player-panel h3 {
            color: #00ff00;
            margin-top: 0;
        }
        
        .chat-window {
            height: 300px;
            background-color: #000;
            border: 1px solid #666;
            padding: 10px;
            margin-bottom: 10px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 12px;
        }
        
        .message {
            margin-bottom: 5px;
            padding: 2px 5px;
            border-radius: 3px;
        }
        
        .message.sent {
            background-color: #1a3a1a;
            color: #00ff00;
        }
        
        .message.received {
            background-color: #3a1a1a;
            color: #ff6666;
        }
        
        .message.system {
            background-color: #3a3a1a;
            color: #ffff66;
        }
        
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }
        
        .input-group input {
            flex: 1;
            padding: 8px;
            background-color: #444;
            border: 1px solid #666;
            color: white;
            border-radius: 3px;
        }
        
        .input-group button {
            padding: 8px 15px;
            background-color: #0066cc;
            color: white;
            border: none;
            border-radius: 3px;
            cursor: pointer;
        }
        
        .input-group button:hover {
            background-color: #0055aa;
        }
        
        .status {
            padding: 5px;
            border-radius: 3px;
            margin-bottom: 10px;
            font-size: 12px;
        }
        
        .status.connected {
            background-color: #1a3a1a;
            color: #00ff00;
        }
        
        .status.disconnected {
            background-color: #3a1a1a;
            color: #ff6666;
        }
        
        .controls {
            background-color: #222;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
        }
        
        .controls h3 {
            color: #00aaff;
            margin-top: 0;
        }
        
        .controls button {
            margin: 5px;
            padding: 8px 15px;
            background-color: #444;
            color: white;
            border: 1px solid #666;
            border-radius: 3px;
            cursor: pointer;
        }
        
        .controls button:hover {
            background-color: #555;
        }
    </style>
</head>
<body>
    <h1>🎮 Chat Message Test - Multiplayer</h1>
    <p>This test simulates two players joining a game and sending chat messages to each other.</p>

    <div class="controls">
        <h3>🐛 Test Controls</h3>
        <button onclick="startTest()">Start Test (Connect Both Players)</button>
        <button onclick="disconnectPlayers()">Disconnect All Players</button>
        <button onclick="clearChats()">Clear All Chat Windows</button>
        <button onclick="sendTestMessage()">Send Test Message from Player 1</button>
    </div>

    <div class="test-container">
        <div class="player-panel">
            <h3>👤 Player 1 (Alice)</h3>
            <div id="player1-status" class="status disconnected">Disconnected</div>
            <div id="player1-chat" class="chat-window"></div>
            <div class="input-group">
                <input id="player1-input" type="text" placeholder="Type a message..." onkeypress="handleKeyPress(event, 'player1')">
                <button onclick="sendMessage('player1')">Send</button>
            </div>
        </div>

        <div class="player-panel">
            <h3>👤 Player 2 (Bob)</h3>
            <div id="player2-status" class="status disconnected">Disconnected</div>
            <div id="player2-chat" class="chat-window"></div>
            <div class="input-group">
                <input id="player2-input" type="text" placeholder="Type a message..." onkeypress="handleKeyPress(event, 'player2')">
                <button onclick="sendMessage('player2')">Send</button>
            </div>
        </div>
    </div>

    <!-- Socket.io -->
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>

    <script>
        // Player data
        const players = {
            player1: {
                name: 'Alice',
                avatarUrl: 'https://gravatar.com/avatar/alice?s=400&d=robohash&r=x',
                socket: null,
                connected: false
            },
            player2: {
                name: 'Bob',
                avatarUrl: 'https://gravatar.com/avatar/bob?s=400&d=robohash&r=x',
                socket: null,
                connected: false
            }
        };

        // Server URL
        const serverUrl = 'http://localhost:3000';

        function updateStatus(playerId, connected) {
            const statusElement = document.getElementById(`${playerId}-status`);
            const player = players[playerId];
            
            player.connected = connected;
            
            if (connected) {
                statusElement.textContent = `Connected (${player.name})`;
                statusElement.className = 'status connected';
            } else {
                statusElement.textContent = 'Disconnected';
                statusElement.className = 'status disconnected';
            }
        }

        function addMessage(playerId, message, type = 'received') {
            const chatWindow = document.getElementById(`${playerId}-chat`);
            const messageElement = document.createElement('div');
            messageElement.className = `message ${type}`;
            
            const timestamp = new Date().toLocaleTimeString();
            messageElement.textContent = `[${timestamp}] ${message}`;
            
            chatWindow.appendChild(messageElement);
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }

        function connectPlayer(playerId) {
            const player = players[playerId];
            
            // Create socket connection
            player.socket = io(serverUrl, {
                transports: ['websocket', 'polling'],
                timeout: 20000
            });

            // Connection events
            player.socket.on('connect', () => {
                console.log(`${player.name} connected`);
                updateStatus(playerId, true);
                addMessage(playerId, `Connected to server`, 'system');
                
                // Join game
                const playerData = {
                    name: player.name,
                    avatarUrl: player.avatarUrl,
                    bank: 1000,
                    vk_user_id: Math.floor(Math.random() * 10000)
                };
                
                player.socket.emit('joinGame', playerData);
            });

            player.socket.on('disconnect', () => {
                console.log(`${player.name} disconnected`);
                updateStatus(playerId, false);
                addMessage(playerId, `Disconnected from server`, 'system');
            });

            // Game events
            player.socket.on('gameJoined', (data) => {
                console.log(`${player.name} joined game:`, data);
                addMessage(playerId, `Joined game (Player ID: ${data.playerId})`, 'system');
            });

            player.socket.on('gameStateUpdate', (data) => {
                console.log(`${player.name} game state update:`, data);
                if (data.gameState) {
                    const playerCount = data.gameState.players ? data.gameState.players.length : 0;
                    addMessage(playerId, `Game state: ${data.gameState.status} (${playerCount} players)`, 'system');
                }
            });

            // Chat events
            player.socket.on('chatMessage', (data) => {
                console.log(`${player.name} received chat message:`, data);
                const message = `${data.playerName}: ${data.message}`;
                addMessage(playerId, message, 'received');
            });

            // Error events
            player.socket.on('error', (data) => {
                console.error(`${player.name} error:`, data);
                addMessage(playerId, `Error: ${data.message}`, 'system');
            });
        }

        function disconnectPlayer(playerId) {
            const player = players[playerId];
            if (player.socket) {
                player.socket.disconnect();
                player.socket = null;
            }
            updateStatus(playerId, false);
        }

        function sendMessage(playerId) {
            const player = players[playerId];
            const inputElement = document.getElementById(`${playerId}-input`);
            const message = inputElement.value.trim();
            
            if (!message || !player.connected) return;
            
            // Send message through socket
            player.socket.emit('chatMessage', {
                message: message,
                timestamp: Date.now()
            });
            
            // Add to local chat
            addMessage(playerId, `You: ${message}`, 'sent');
            
            // Clear input
            inputElement.value = '';
        }

        function handleKeyPress(event, playerId) {
            if (event.key === 'Enter') {
                sendMessage(playerId);
            }
        }

        // Test functions
        function startTest() {
            console.log('Starting chat test...');
            
            // Connect both players
            connectPlayer('player1');
            setTimeout(() => {
                connectPlayer('player2');
            }, 1000);
        }

        function disconnectPlayers() {
            console.log('Disconnecting all players...');
            disconnectPlayer('player1');
            disconnectPlayer('player2');
        }

        function clearChats() {
            console.log('Clearing all chat windows...');
            document.getElementById('player1-chat').innerHTML = '';
            document.getElementById('player2-chat').innerHTML = '';
        }

        function sendTestMessage() {
            if (players.player1.connected) {
                const inputElement = document.getElementById('player1-input');
                inputElement.value = 'Hello from Alice! This is a test message.';
                sendMessage('player1');
            } else {
                alert('Player 1 is not connected. Please start the test first.');
            }
        }

        // Auto-start test after page load
        window.addEventListener('load', () => {
            console.log('Chat message test page loaded');
            console.log('Click "Start Test" to begin testing chat functionality');
        });
    </script>
</body>
</html>
