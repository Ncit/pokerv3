<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Single Room Poker Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #040218;
            color: white;
            text-align: center;
            padding: 20px;
        }
        .test-info {
            background-color: #1a1a1a;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 20px;
            margin: 20px auto;
            max-width: 800px;
        }
        .status {
            background-color: #2a2a2a;
            border: 1px solid #444;
            border-radius: 8px;
            padding: 15px;
            margin: 10px 0;
        }
        .status.connected {
            border-color: #00ff00;
            background-color: #1a2a1a;
        }
        .status.disconnected {
            border-color: #ff0000;
            background-color: #2a1a1a;
        }
        .test-button {
            background-color: #4CAF50;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin: 10px;
        }
        .test-button:hover {
            background-color: #45a049;
        }
        .test-button:disabled {
            background-color: #666;
            cursor: not-allowed;
        }
        .player-list {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin: 20px 0;
        }
        .player-card {
            background-color: #2a2a2a;
            border: 1px solid #444;
            border-radius: 8px;
            padding: 15px;
            min-width: 150px;
        }
        .log {
            background-color: #000;
            border: 1px solid #333;
            border-radius: 4px;
            padding: 10px;
            height: 200px;
            overflow-y: auto;
            text-align: left;
            font-family: monospace;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <h1>🎰 Single Room Poker Test</h1>
    
    <div class="test-info">
        <h2>Server Status</h2>
        <div id="server-status" class="status disconnected">
            <p>🔴 Server: Disconnected</p>
            <p>📊 Room Status: Unknown</p>
        </div>
    </div>

    <div class="test-info">
        <h2>Test Controls</h2>
        <button class="test-button" onclick="connectToServer()">🔌 Connect to Server</button>
        <button class="test-button" onclick="joinRoom()" id="join-btn" disabled>👤 Join Room</button>
        <button class="test-button" onclick="leaveRoom()" id="leave-btn" disabled>🚪 Leave Room</button>
        <button class="test-button" onclick="testPokerAction()" id="action-btn" disabled>🎯 Test Action</button>
        <button class="test-button" onclick="openGame()">🎮 Open Game</button>
    </div>

    <div class="test-info">
        <h2>Room Players</h2>
        <div id="player-list" class="player-list">
            <p>No players in room</p>
        </div>
    </div>

    <div class="test-info">
        <h2>Event Log</h2>
        <div id="event-log" class="log"></div>
        <button class="test-button" onclick="clearLog()">🗑️ Clear Log</button>
    </div>

    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script>
        let socket = null;
        let isConnected = false;
        let isInRoom = false;
        let players = [];
        let myPlayerId = null;

        function log(message) {
            const logElement = document.getElementById('event-log');
            const timestamp = new Date().toLocaleTimeString();
            logElement.innerHTML += `[${timestamp}] ${message}\n`;
            logElement.scrollTop = logElement.scrollHeight;
        }

        function updateServerStatus() {
            const statusElement = document.getElementById('server-status');
            if (isConnected) {
                statusElement.className = 'status connected';
                statusElement.innerHTML = `
                    <p>🟢 Server: Connected</p>
                    <p>📊 Room Status: ${isInRoom ? 'Joined' : 'Not Joined'}</p>
                    <p>👥 Players in Room: ${players.length}</p>
                `;
            } else {
                statusElement.className = 'status disconnected';
                statusElement.innerHTML = `
                    <p>🔴 Server: Disconnected</p>
                    <p>📊 Room Status: Unknown</p>
                `;
            }
        }

        function updatePlayerList() {
            const playerListElement = document.getElementById('player-list');
            if (players.length === 0) {
                playerListElement.innerHTML = '<p>No players in room</p>';
                return;
            }

            playerListElement.innerHTML = players.map(player => `
                <div class="player-card">
                    <h4>${player.name}</h4>
                    <p>ID: ${player.id}</p>
                    <p>Bank: $${player.bank}</p>
                    <p>${player.id === myPlayerId ? '👤 (You)' : ''}</p>
                </div>
            `).join('');
        }

        function updateButtons() {
            document.getElementById('join-btn').disabled = !isConnected || isInRoom;
            document.getElementById('leave-btn').disabled = !isConnected || !isInRoom;
            document.getElementById('action-btn').disabled = !isConnected || !isInRoom;
        }

        function connectToServer() {
            if (socket) {
                socket.disconnect();
            }

            log('Connecting to server...');
            socket = io('http://localhost:3000');

            socket.on('connect', () => {
                isConnected = true;
                log('✅ Connected to server');
                updateServerStatus();
                updateButtons();
            });

            socket.on('disconnect', () => {
                isConnected = false;
                isInRoom = false;
                players = [];
                myPlayerId = null;
                log('❌ Disconnected from server');
                updateServerStatus();
                updatePlayerList();
                updateButtons();
            });

            socket.on('gameJoined', (data) => {
                isInRoom = true;
                myPlayerId = data.playerId;
                players = data.players;
                log(`✅ Joined room: ${data.gameId}`);
                log(`👤 Your player ID: ${data.playerId}`);
                updateServerStatus();
                updatePlayerList();
                updateButtons();
            });

            socket.on('playerJoined', (data) => {
                const newPlayer = data.player;
                const existingIndex = players.findIndex(p => p.id === newPlayer.id);
                if (existingIndex >= 0) {
                    players[existingIndex] = newPlayer;
                } else {
                    players.push(newPlayer);
                }
                log(`👤 Player joined: ${newPlayer.name} (ID: ${newPlayer.id})`);
                updateServerStatus();
                updatePlayerList();
            });

            socket.on('playerLeft', (data) => {
                players = players.filter(p => p.id !== data.playerId);
                log(`👋 Player left: ${data.playerName} (ID: ${data.playerId})`);
                updateServerStatus();
                updatePlayerList();
            });

            socket.on('gameStateUpdate', (data) => {
                log(`🔄 Game state updated: ${data.gameState.phase} phase`);
                if (data.lastAction) {
                    log(`🎯 Last action: ${data.lastAction.action} by ${data.lastAction.playerName}`);
                }
            });

            socket.on('error', (data) => {
                log(`❌ Error: ${data.message}`);
            });
        }

        function joinRoom() {
            if (!socket || !isConnected) {
                log('❌ Not connected to server');
                return;
            }

            const playerData = {
                name: `TestPlayer${Math.floor(Math.random() * 1000)}`,
                avatarUrl: 'https://gravatar.com/avatar/default?s=400&d=robohash&r=x',
                bank: 1000,
                vk_user_id: Math.floor(Math.random() * 10000)
            };

            log(`👤 Joining room as: ${playerData.name}`);
            socket.emit('joinGame', playerData);
        }

        function leaveRoom() {
            if (!socket || !isConnected) {
                log('❌ Not connected to server');
                return;
            }

            log('🚪 Leaving room...');
            socket.disconnect();
        }

        function testPokerAction() {
            if (!socket || !isConnected || !isInRoom) {
                log('❌ Not in room');
                return;
            }

            const actions = ['fold', 'call', 'raise', 'allIn'];
            const randomAction = actions[Math.floor(Math.random() * actions.length)];
            const amount = randomAction === 'raise' ? Math.floor(Math.random() * 100) + 10 : 0;

            log(`🎯 Testing action: ${randomAction}${amount > 0 ? ` ($${amount})` : ''}`);
            socket.emit('pokerAction', { action: randomAction, amount });
        }

        function openGame() {
            // Set debug mode and open the game
            window.isDebug = true;
            window.open('./index.html', '_blank', 'width=1280,height=720');
            log('🎮 Opening game in new window');
        }

        function clearLog() {
            document.getElementById('event-log').innerHTML = '';
        }

        // Initialize
        updateServerStatus();
        updateButtons();
        log('🚀 Single Room Poker Test initialized');
        log('Click "Connect to Server" to start testing');
    </script>
</body>
</html>
